name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-gate:
    name: PV discovery regression tests
    needs: issue-51-regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both JSON backend suites
        env:
          MATRIX_RESULT: ${{ needs.issue-51-regression.result }}
        run: test "$MATRIX_RESULT" = "success"

  issue-51-regression:
    name: PV discovery regression tests (${{ matrix.json-backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        json-backend: [json, simplejson]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Select and verify Requests JSON decoder
        env:
          JSON_BACKEND: ${{ matrix.json-backend }}
        run: |
          if [ "$JSON_BACKEND" = "simplejson" ]; then
            python -m pip install 'simplejson>=3,<5'
          else
            python -m pip uninstall --yes simplejson
          fi
          python -c 'import os, requests; assert requests.compat.json.__name__ == os.environ["JSON_BACKEND"], requests.compat.json.__name__'

      - name: Compile integration and tests
        run: python -m compileall -q custom_components/fusion_solar_app tests

      - name: Run complete test suite with coverage
        run: >-
          python -m pytest tests -v
          --cov=custom_components/fusion_solar_app
          --cov-branch
          --cov-fail-under=78
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-report=xml:coverage.xml
          --junitxml=test-results.xml

      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results-${{ matrix.json-backend }}
          path: |
            coverage.xml
            coverage.json
            test-results.xml
          if-no-files-found: ignore
