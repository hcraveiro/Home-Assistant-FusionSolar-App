name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-51-regression:
    name: PV discovery regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile integration and tests
        run: python -m compileall -q custom_components/fusion_solar_app tests

      - name: Run complete test suite with coverage
        run: >-
          python -m pytest tests -v
          --cov=custom_components/fusion_solar_app
          --cov-fail-under=30
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=test-results.xml

      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
